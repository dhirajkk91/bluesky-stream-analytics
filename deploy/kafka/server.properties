# Apache Kafka 4.3, one node acting as both broker and KRaft controller.
# Installed as /etc/kafka/server.properties.

process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=127.0.0.1:9093

# Localhost only: every producer and consumer runs on this server, and no port
# is opened to the internet.
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER

log.dirs=/var/lib/kafka/data

# Topics are created only by ensure-topic, so a mistyped name fails instead of
# quietly creating a new topic.
auto.create.topics.enable=false
num.partitions=1
default.replication.factor=1

# Kafka's own topics have one copy, as there's one broker.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# Defaults for any topic without its own settings. jetstream.events sets its own.
log.retention.hours=72
log.segment.bytes=268435456

# A consumer that joins an empty group starts at once rather than after 3 seconds.
group.initial.rebalance.delay.ms=0
