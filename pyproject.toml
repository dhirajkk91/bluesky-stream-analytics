[project]
name = "bluesky-stream-analytics"
version = "0.1.0"
description = "Collects Bluesky's public Jetstream feed and turns it into product analytics"
readme = "README.md"
authors = [
    { name = "dhirajkk91", email = "dhirajkk91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43",
    "duckdb>=2.0.0",
    "websockets>=17.3",
]

[project.scripts]
watch = "bluesky_stream_analytics.watch:main"
collect = "bluesky_stream_analytics.collect:main"
upload = "bluesky_stream_analytics.upload:main"
process = "bluesky_stream_analytics.process:main"
fetch-raw = "bluesky_stream_analytics.fetch_raw:main"
project = "bluesky_stream_analytics.projections:main"
compact = "bluesky_stream_analytics.compact:main"
resolve-handles = "bluesky_stream_analytics.handles:main"
check-health = "bluesky_stream_analytics.monitor:check_main"
ping-check = "bluesky_stream_analytics.monitor:ping_main"

[dependency-groups]
bench = [
    "pyspark>=4.1.3,<4.2",
]
dev = [
    "pytest>=9.1.1",
    "dbt-duckdb>=1.11.1,<1.12",
]
marts = [
    "dbt-core>=1.12.6,<1.13",
    "dbt-athena>=1.11.1,<1.12",
]

[tool.uv]
default-groups = ["dev", "marts"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
