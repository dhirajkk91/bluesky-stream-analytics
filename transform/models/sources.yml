version: 2

sources:
  - name: bluesky_store
    description: The event store and the projections, written by the jobs on the server.
    schema: bluesky_store
    tables:
      - name: events
        description: Every Jetstream event exactly once. See docs/architectures/event-store.md.
      - name: current_records
        description: The projections' view of every record that exists now, at its latest version. See docs/architectures/projections.md.
      - name: account_handles
        description: The handle of each account whose identity changed, looked up by the handle job. See docs/architectures/handles.md.
